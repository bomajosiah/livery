<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livery</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <strong class="brand">Livery</strong>
      <span class="sep">/</span>
      <span id="system-name" class="muted"></span>
      <span id="source" class="chip"></span>
      <nav class="seg" id="frames" aria-label="Themes shown">
        <button data-frames="both" aria-pressed="true">Both</button>
        <button data-frames="light">Light</button>
        <button data-frames="dark">Dark</button>
      </nav>
    </header>
    <main class="layout">
      <aside class="panel">
        <nav class="tabs" id="tabs" aria-label="Editor">
          <button data-view="foundations" aria-pressed="true">Foundations</button>
          <button data-view="components" aria-pressed="false">Components</button>
        </nav>
        <div id="view-components" hidden>
          <div id="component-list">
            <input id="component-search" type="search" placeholder="Search components" aria-label="Search components" />
            <ul id="components" class="components"></ul>
          </div>
          <div id="component-detail" hidden></div>
        </div>
        <div id="view-foundations">
        <section>
          <h2>Scales</h2>
          <div id="scales"></div>
          <form id="add-scale" class="row add">
            <select id="palette-scale" aria-label="Tailwind scale"></select>
            <button type="submit">Add</button>
          </form>
          <form id="new-scale" class="row add">
            <input id="new-scale-name" placeholder="brand" aria-label="New scale name" pattern="[a-z][a-z0-9\-]*" required />
            <input id="new-scale-seed" type="color" value="#4f46e5" aria-label="Seed colour" />
            <button type="submit">Create</button>
          </form>
        </section>
        <section>
          <h2>Roles</h2>
          <div class="roles-head"><span></span><span>Light</span><span>Dark</span></div>
          <div id="roles"></div>
        </section>
        <section>
          <h2>Shape</h2>
          <label class="field">
            <span>Radius</span>
            <input id="radius" type="range" min="0" max="1.5" step="0.025" />
            <output id="radius-out"></output>
          </label>
          <p class="reach" id="reach-radius"></p>
        </section>
        <section>
          <h2>Spacing <button class="reset" data-reset-group="spacing" type="button">Reset</button></h2>
          <label class="field">
            <span>Unit</span>
            <input id="spacing" type="range" min="0.15" max="0.4" step="0.005" />
            <output id="spacing-out"></output>
          </label>
          <div class="ruler" id="spacing-ruler"></div>
          <p class="reach" id="reach-spacing"></p>
        </section>
        <section>
          <h2>Type <button class="reset" data-reset-group="type" type="button">Reset</button></h2>
          <label class="field stack">
            <span>Sans</span>
            <input id="font-sans" spellcheck="false" />
          </label>
          <label class="field stack">
            <span>Heading</span>
            <input id="font-heading" spellcheck="false" />
          </label>
          <label class="field">
            <span>Base</span>
            <input id="type-base" type="range" min="0.75" max="1.25" step="0.0125" />
            <output id="type-base-out"></output>
          </label>
          <label class="field stack">
            <span>Ratio</span>
            <select id="type-ratio">
              <option value="">Tailwind</option>
              <option value="1.067">1.067 · minor second</option>
              <option value="1.125">1.125 · major second</option>
              <option value="1.2">1.2 · minor third</option>
              <option value="1.25">1.25 · major third</option>
              <option value="1.333">1.333 · perfect fourth</option>
            </select>
          </label>
          <div id="type-scale" class="type-scale"></div>
          <div id="weights" class="weights"></div>
        </section>
        <section>
          <h2>Elevation <button class="reset" data-reset-group="elevation" type="button">Reset</button></h2>
          <label class="field">
            <span>Strength</span>
            <input id="shadow-intensity" type="range" min="0" max="3" step="0.05" />
            <output id="shadow-intensity-out"></output>
          </label>
          <label class="field stack">
            <span>Tint</span>
            <select id="shadow-color"></select>
          </label>
          <div id="shadows" class="shadows"></div>
        </section>
        <section>
          <h2>Motion <button class="reset" data-reset-group="motion" type="button">Reset</button></h2>
          <label class="field">
            <span>Duration</span>
            <input id="duration" type="range" min="0" max="400" step="10" />
            <output id="duration-out"></output>
          </label>
          <label class="field stack">
            <span>Easing</span>
            <select id="easing"></select>
          </label>
          <div class="motion-demo" id="motion-demo"><i></i></div>
          <p class="reach" id="reach-motion"></p>
        </section>
        <section>
          <h2>Contrast <span id="checks-summary" class="muted"></span></h2>
          <ul id="checks" class="checks"></ul>
        </section>
        </div>
      </aside>
      <section class="frames" id="frame-area">
        <figure data-theme="light"><figcaption>Light</figcaption><iframe title="Light preview"></iframe></figure>
        <figure data-theme="dark"><figcaption>Dark</figcaption><iframe title="Dark preview"></iframe></figure>
      </section>
    </main>
    <div id="picker" class="picker" hidden>
      <div class="picker-head">
        <strong id="picker-title"></strong>
        <label>Alpha <input id="picker-alpha" placeholder="100%" size="5" /></label>
      </div>
      <div id="picker-scales"></div>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
